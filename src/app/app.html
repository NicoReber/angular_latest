<main class="page-shell">
  <nav class="breadcrumb-nav" aria-label="Booking workflow steps">
    <button type="button" (click)="logEnum('Second')">Test</button>
    <ol class="breadcrumb-list">
      @for (step of stepCards(); track step.id) {
        <li
          class="breadcrumb-item"
          [class.current]="step.state === 'current'"
          [class.complete]="step.state === 'complete'"
          [class.locked]="step.state === 'locked'"
        >
          <button
            type="button"
            class="breadcrumb-button"
            [disabled]="step.disabled"
            (click)="goToStep(step.id)"
          >
            <span class="breadcrumb-step">{{ step.id }}. {{ step.title }}</span>
            <span class="breadcrumb-summary">{{ step.summary }}</span>
          </button>
        </li>
      }
    </ol>
  </nav>

  <section class="wizard-stage full-width-stage">
    @switch (activeStep()) {
      @case (1) {
        <app-import-step
          [importControl]="importControl"
          [parseErrors]="parseErrors()"
          [canContinue]="canContinueFromImport()"
          (next)="goToStep(2)"
        />
      }
      @case (2) {
        <app-mapping-step
          [ambiguousRows]="ambiguousResolutionRows()"
          [mappedCount]="mappedCount()"
          [blockers]="blockers()"
          [canContinue]="canContinueFromMapping()"
          (lineSelected)="selectOrderLine($event)"
          (back)="goToStep(1)"
          (next)="goToStep(3)"
        />
      }
      @case (3) {
        <app-booking-step
          [resolutionRows]="resolutionRows()"
          [blockers]="blockers()"
          [lineCount]="bookingSummary().lineCount"
          [totalQuantity]="bookingSummary().totalQuantity"
          [canBook]="readyToBook() && blockers().length === 0"
          [bookingResult]="bookingResult()"
          (back)="goToStep(2)"
          (book)="book()"
        />
      }
    }
  </section>
</main>
